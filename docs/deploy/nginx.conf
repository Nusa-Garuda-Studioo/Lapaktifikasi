# ==============================================================================
# LAPAKTIFIKASI - NGINX GLOBAL CONFIGURATION (/etc/nginx/nginx.conf)
# Production tuning for high-traffic Laravel 13 marketplace
# ==============================================================================

user www-data;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

# Optimal: auto (matches available CPU cores)
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;

    # MIME Types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Settings (Minimal I/O for performance)
    log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_timed buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Client Connection Timeouts & Buffers
    client_body_buffer_size 128k;
    client_max_body_size 64M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    keepalive_timeout 65;
    keepalive_requests 1000;
    send_timeout 30;

    # Open File Cache (Caches file descriptors of static assets)
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ==========================================================================
    # GZIP & BROTLI COMPRESSION
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2
        application/vnd.ms-fontobject
        application/x-font-ttf;

    # Brotli (Uncomment if ngx_brotli module is compiled)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types
    #     text/plain text/css text/xml text/javascript
    #     application/javascript application/x-javascript application/json
    #     application/xml application/rss+xml image/svg+xml
    #     font/woff font/woff2 application/vnd.ms-fontobject application/x-font-ttf;

    # Virtual Host Configs
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
