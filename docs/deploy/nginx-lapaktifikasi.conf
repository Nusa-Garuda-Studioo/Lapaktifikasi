# ==============================================================================
# LAPAKTIFIKASI - HIGH-PERFORMANCE NGINX VIRTUAL HOST CONFIGURATION
# Location: /etc/nginx/sites-available/lapaktifikasi.conf
#
# Meets PageSpeed Insights requirements:
# - Efficient Cache Lifetimes for Vite Hashed Builds (max-age=31536000, immutable)
# - Static Assets Expiry (30 days to 1 year)
# - Instant PWA updates (sw.js & manifest.json no-cache)
# - HTTP/2 & HTTP/3 (QUIC) Ready
# - Zero Re-compression of WebP/AVIF
# ==============================================================================

# HTTP -> HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name lapaktifikasi.com www.lapaktifikasi.com;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/lapaktifikasi/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server Block
server {
    # HTTP/2 and modern SSL
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # HTTP/3 (QUIC) - Enable if Nginx 1.25+ compiled with --with-http_v3_module
    # listen 443 quic reuseport;
    # listen [::]:443 quic reuseport;
    # add_header Alt-Svc 'h3=":443"; ma=86400';

    server_name lapaktifikasi.com www.lapaktifikasi.com;
    root /var/www/lapaktifikasi/public;
    index index.php index.html;

    charset utf-8;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/lapaktifikasi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lapaktifikasi.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/lapaktifikasi.com/chain.pem;

    # Modern SSL Protocol & Ciphers (Mozilla Modern Profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # TCP & Network Optimizations
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_max_body_size 64M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ==========================================================================
    # 1. TEXT COMPRESSION (BROTLI & GZIP)
    # ==========================================================================
    # Gzip settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2
        application/vnd.ms-fontobject
        application/x-font-ttf;

    # Brotli settings (Requires ngx_brotli module)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types
    #     text/plain
    #     text/css
    #     text/xml
    #     text/javascript
    #     application/javascript
    #     application/x-javascript
    #     application/json
    #     application/xml
    #     application/rss+xml
    #     image/svg+xml
    #     font/woff
    #     font/woff2
    #     application/vnd.ms-fontobject
    #     application/x-font-ttf;

    # ==========================================================================
    # 2. CACHE-CONTROL RULES
    # ==========================================================================

    # A. VITE HASHED BUILDS (/build/*)
    # File hash in filename ensures uniqueness. Cache forever (1 year + immutable).
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # B. PWA SERVICE WORKER & MANIFEST (STRICT NO-CACHE)
    # Never cache sw.js or manifest.json so PWA updates deploy immediately.
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, max-age=0, must-revalidate" always;
        add_header Pragma "no-cache" always;
        access_log off;
        log_not_found off;
    }

    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-cache, no-store, max-age=0, must-revalidate" always;
        add_header Pragma "no-cache" always;
        access_log off;
        log_not_found off;
    }

    # C. STATIC ASSETS (/assets/*, fonts, images, static css/js)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|svg|woff2?|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # ==========================================================================
    # 3. ROUTING & FASTCGI PHP-FPM
    # ==========================================================================

    # Laravel Front Controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Processor
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock; # Adjust PHP version as needed
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # FastCGI Keep-Alive & Performance Buffers
        fastcgi_keep_conn on;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
        fastcgi_read_timeout 60s;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;

        # HTML Dynamic responses: no-cache / private
        add_header Cache-Control "no-cache, private, must-revalidate" always;
    }

    # Prevent access to hidden files (.env, .git, .htaccess, etc)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Disable favicon and robots.txt 404 logging
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}
